<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music API Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            --glass-backdrop: blur(12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .api-url {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .api-url input {
            background: transparent;
            border: none;
            color: var(--text);
            outline: none;
            width: 250px;
            font-family: monospace;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--text);
            background: rgba(255,255,255,0.05);
        }

        .tab-btn.active {
            color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        .panel {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Search Section */
        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-box input {
            flex: 1;
            background: var(--surface-color);
            border: 1px solid var(--border);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            backdrop-filter: var(--glass-backdrop);
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .song-card {
            background: var(--surface-color);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: var(--glass-backdrop);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .song-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.2);
            box-shadow: var(--glass-shadow);
        }

        .song-art {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #2a2a2a;
        }

        .song-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }

        .song-card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            padding-left: 5px; /* Visual center for play icon */
        }

        .play-btn:hover {
            transform: scale(1.1);
            background: var(--primary-hover);
        }

        .song-info {
            padding: 1.25rem;
        }

        .song-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .provider-badge {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .player-bar.active {
            transform: translateY(0);
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 300px;
        }

        .now-playing img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        .np-info {
            overflow: hidden;
        }

        .np-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-artist {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .audio-controls {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        audio {
            width: 100%;
            max-width: 600px;
            height: 40px;
        }

        .close-player {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .close-player:hover {
            color: white;
        }

        /* Loader */
        .loader {
            display: none;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 3rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .raw-json {
            background: rgba(0,0,0,0.5);
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #a78bfa;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 300px;
            margin-top: 1rem;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-bolt"></i>
            API Tester
        </div>
        <div class="api-url">
            <i class="fa-solid fa-server"></i>
            <input type="text" id="baseUrl" value="https://music-l0wf.onrender.com/api/v1">
        </div>
    </header>

    <main>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('search')">Search Engine</button>
            <button class="tab-btn" onclick="switchTab('trending')">Trending Hits</button>
        </div>

        <div id="errorBox" class="error-msg"></div>

        <!-- SEARCH TAB -->
        <div id="search-tab" class="panel active">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search for songs, artists, or albums (e.g. 'Tere Liye Atif')" onkeypress="if(event.key === 'Enter') performSearch()">
                <button class="btn" onclick="performSearch()">
                    <i class="fa-solid fa-search"></i> Search
                </button>
            </div>
            
            <div id="searchLoader" class="loader"></div>
            <div id="searchResults" class="results-grid"></div>
        </div>

        <!-- TRENDING TAB -->
        <div id="trending-tab" class="panel">
            <div style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                <h2>Global Top Hits</h2>
                <button class="btn" onclick="fetchTrending()">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
            </div>
            
            <div id="trendingLoader" class="loader"></div>
            <div id="trendingResults" class="results-grid"></div>
        </div>
    </main>

    <div id="playerBar" class="player-bar">
        <div class="now-playing">
            <img id="npImage" src="https://via.placeholder.com/50" alt="Cover">
            <div class="np-info">
                <div id="npTitle" class="np-title">Loading Stream...</div>
                <div id="npArtist" class="np-artist">Please wait</div>
            </div>
        </div>
        <div class="audio-controls">
            <audio id="audioPlayer" controls autoplay></audio>
        </div>
        <button class="close-player" onclick="closePlayer()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <script>
        function getBaseUrl() {
            return document.getElementById('baseUrl').value.replace(/\/$/, '');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId + '-tab').classList.add('active');
            
            if (tabId === 'trending' && document.getElementById('trendingResults').innerHTML === '') {
                fetchTrending();
            }
        }

        function showError(msg) {
            const eb = document.getElementById('errorBox');
            eb.style.display = 'block';
            eb.textContent = msg;
            setTimeout(() => eb.style.display = 'none', 5000);
        }

        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function createSongCard(song) {
            const artists = song.artists.map(a => a.name).join(', ');
            return `
                <div class="song-card">
                    <div class="song-art">
                        <img src="${song.imageUrl || 'https://via.placeholder.com/300'}" alt="${song.title}">
                        <div class="play-overlay" onclick="playSong('${song.id}', \`${song.title.replace(/`/g, "'")}\`, \`${artists.replace(/`/g, "'")}\`, '${song.imageUrl}')">
                            <button class="play-btn"><i class="fa-solid fa-play"></i></button>
                        </div>
                    </div>
                    <div class="song-info">
                        <div class="song-title" title="${song.title}">${song.title}</div>
                        <div class="song-artist" title="${artists}">${artists}</div>
                        <div class="song-meta">
                            <span><i class="fa-regular fa-clock"></i> ${formatDuration(song.duration)}</span>
                            <span class="provider-badge">${song.providerId}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const loader = document.getElementById('searchLoader');
            const resultsDiv = document.getElementById('searchResults');
            
            loader.style.display = 'block';
            resultsDiv.innerHTML = '';

            try {
                const res = await fetch(`${getBaseUrl()}/music/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (!data.success) throw new Error(data.error.message || 'API Error');
                
                if (data.data.songs.length === 0) {
                    resultsDiv.innerHTML = '<div style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 2rem;">No results found</div>';
                } else {
                    resultsDiv.innerHTML = data.data.songs.map(song => createSongCard(song)).join('');
                }
            } catch (err) {
                showError(err.message);
            } finally {
                loader.style.display = 'none';
            }
        }

        async function fetchTrending() {
            const loader = document.getElementById('trendingLoader');
            const resultsDiv = document.getElementById('trendingResults');
            
            loader.style.display = 'block';
            resultsDiv.innerHTML = '';

            try {
                const res = await fetch(`${getBaseUrl()}/music/trending`);
                const data = await res.json();

                if (!data.success) throw new Error(data.error.message || 'API Error');
                
                resultsDiv.innerHTML = data.data.map(song => createSongCard(song)).join('');
            } catch (err) {
                showError(err.message);
            } finally {
                loader.style.display = 'none';
            }
        }

        async function playSong(streamRef, title, artist, img) {
            const bar = document.getElementById('playerBar');
            const audio = document.getElementById('audioPlayer');
            
            document.getElementById('npTitle').textContent = 'Extracting stream...';
            document.getElementById('npArtist').textContent = 'Connecting to backend';
            document.getElementById('npImage').src = img || 'https://via.placeholder.com/50';
            
            bar.classList.add('active');
            audio.pause();
            audio.src = '';

            try {
                const res = await fetch(`${getBaseUrl()}/music/stream?id=${encodeURIComponent(streamRef)}&quality=high`);
                const data = await res.json();

                if (!data.success) throw new Error(data.error.message || 'Failed to extract stream');

                document.getElementById('npTitle').textContent = title;
                document.getElementById('npArtist').innerHTML = `${artist} <br><span style="color: #60a5fa; font-size: 0.75rem; font-weight: 600;">⚡ ${data.data.quality}</span>`;
                
                audio.src = data.data.url;
                audio.play();

            } catch (err) {
                document.getElementById('npTitle').textContent = 'Stream Failed';
                document.getElementById('npArtist').textContent = err.message;
                showError('Stream Error: ' + err.message);
            }
        }

        function closePlayer() {
            const bar = document.getElementById('playerBar');
            const audio = document.getElementById('audioPlayer');
            
            audio.pause();
            bar.classList.remove('active');
        }
    </script>
</body>
</html>
